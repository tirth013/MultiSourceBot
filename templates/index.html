<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiSource-Bot</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gradient-start: #4f46e5;
            --gradient-end: #7c3aed;
            --background-light: #f8fafc;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --accent-color: #6366f1;
            --border-color: #e2e8f0;
            --shadow-medium: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--background-light) 0%, #e9ecef 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 600px;
            border-radius: 1.5rem;
            box-shadow: var(--shadow-medium);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .header {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: white;
            padding: 2.5rem 2rem;
            text-align: center;
        }

        .header-icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            color: rgba(255,255,255,0.9);
        }

        .header h1 {
            font-family: 'Quicksand', sans-serif;
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .header p {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.9);
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .content {
            padding: 2rem;
            background: white;
        }

        .search-wrapper {
            display: flex;
            background: white;
            border-radius: 1rem;
            padding: 0.75rem;
            box-shadow: var(--shadow-medium);
            border: 1px solid var(--border-color);
        }

        .search-input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 1rem 1.25rem;
            font-size: 1.1rem;
            color: var(--text-primary);
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .search-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.7;
        }

        .search-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .search-btn:hover {
            background: #4f46e5;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 2rem 0;
        }

        .loading-spinner {
            border: 3px solid rgba(99, 102, 241, 0.1);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            width: 3rem;
            height: 3rem;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-secondary);
            margin-top: 1rem;
            font-size: 1rem;
            font-weight: 500;
        }

        .result-container {
            display: none;
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            margin-top: 2rem;
            box-shadow: var(--shadow-medium);
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .result-container::-webkit-scrollbar {
            width: 8px;
        }

        .result-container::-webkit-scrollbar-track {
            background: var(--background-light);
            border-radius: 4px;
        }

        .result-container::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 4px;
        }

        .result-content {
            color: var(--text-primary);
            font-size: 1rem;
            line-height: 1.8;
        }

        .footer {
            padding: 1.5rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
            border-top: 1px solid var(--border-color);
            background: var(--background-light);
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }

            .container {
                border-radius: 1rem;
            }

            .header {
                padding: 2rem 1.5rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .content {
                padding: 1.5rem;
            }

            .search-wrapper {
                flex-direction: column;
                gap: 1rem;
            }

            .search-input {
                width: 100%;
                padding: 0.75rem 1rem;
            }

            .search-btn {
                width: 100%;
                justify-content: center;
                padding: 0.75rem;
            }

            .result-container {
                padding: 1.5rem;
                margin-top: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">
                <i class="fas fa-brain"></i>
            </div>
            <h1>MultiSource Research Bot</h1>
            <p>Harness the power of AI to synthesize knowledge from multiple sources instantly</p>
        </div>
        
        <div class="content">
            <div class="search-wrapper">
                <input type="text" id="query" class="search-input" placeholder="What would you like to research?">
                <button id="researchBtn" class="search-btn">
                    <i class="fas fa-search"></i>
                    Research Now
                </button>
            </div>

            <div class="loading">
                <div class="loading-spinner"></div>
                <p class="loading-text">Synthesizing knowledge from multiple sources...</p>
            </div>

            <div class="result-container" id="resultContainer">
                <div id="result" class="result-content"></div>
            </div>
        </div>

        <div class="footer">
            © 2024 Research Nexus • Empowering Intelligent Discovery
        </div>
    </div>

    <script>
        document.getElementById('researchBtn').addEventListener('click', async () => {
            const query = document.getElementById('query').value.trim();
            if (!query) {
                alert('Please enter a query to research.');
                return;
            }

            document.querySelector('.loading').style.display = 'block';
            document.getElementById('resultContainer').style.display = 'none';

            try {
                const response = await fetch('/research', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query }),
                });

                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('result').innerHTML = data.result.replace(/\n/g, '<br>');
                    document.getElementById('resultContainer').style.display = 'block';
                } else {
                    alert(data.error || 'An error occurred during research.');
                }
            } catch (error) {
                alert('An error occurred while communicating with the server.');
            } finally {
                document.querySelector('.loading').style.display = 'none';
            }
        });

        document.getElementById('query').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('researchBtn').click();
            }
        });
    </script>
</body>
</html>
